name: Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run album detail snapshot test
        run: make test
